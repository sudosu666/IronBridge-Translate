ext {
    compileSdkVersion = 34
    minSdkVersion = 23
    targetSdkVersion = 34
    appVersionCode = 1
    appVersionName = "1.0.0"
    androidGradlePluginVersion = "8.5.2"
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.5.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
